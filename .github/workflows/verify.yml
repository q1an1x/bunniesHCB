name: Offline verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew test installDist --no-daemon
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate the complete entity catalog without network access
        run: build/install/bunniesHCB/bin/bunniesHCB --mode offline --inventory "$RUNNER_TEMP/hcb-contract.json"
